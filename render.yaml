# Render Blueprint — deploys the Pocketverse API as a free-tier web service.
# The web app deploys separately on Vercel (see docs/DEPLOYMENT.md).
#
# Secrets are intentionally `sync: false`: Render prompts for them on first
# deploy and they never live in this repository.

services:
  - type: web
    name: pocketverse-api
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@10.33.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @pocketverse/api... build
    # Migrations run on every deploy before the server starts — idempotent,
    # and the deploy fails loudly if the database is unreachable.
    startCommand: cd apps/api && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MASTER_KEYS
        sync: false
      - key: MASTER_KEY_ACTIVE
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      # Optional: BullMQ queue backend (Upstash). Leave unset to run jobs
      # in-process, which is fine for a single free-tier instance.
      - key: REDIS_URL
        sync: false
