  </defs>
  <rect width="32" height="32" rx="8" fill="#0a1022" />
  <g transform="translate(16 16)">
    <ellipse rx="11" ry="4.8" transform="rotate(-24)" fill="none" stroke="url(#fring)" stroke-width="1.9" />
    <circle cx="7.2" cy="-5.8" r="1.7" fill="#4fd1c5" />
