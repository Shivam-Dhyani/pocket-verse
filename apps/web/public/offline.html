<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocketverse — offline</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #e7e9f5;
        background:
          radial-gradient(120% 80% at 50% 0%, #161d3a 0%, #0a1022 55%, #070b16 100%);
        text-align: center;
      }
      .card {
        max-width: 30rem;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 20px 0 8px;
      }
      p {
        margin: 0 0 20px;
        line-height: 1.6;
        color: #a7add0;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 11px 20px;
        cursor: pointer;
        background: linear-gradient(120deg, #6d6af8, #9d6af8 55%, #4fd1c5);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon.svg" alt="Pocketverse" />
      <h1>You're offline</h1>
      <p>
        Pocketverse needs a connection to reach your files — they live in your own storage, not on
        this device. Reconnect and you'll pick up right where you left off.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
